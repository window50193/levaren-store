<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LÉVAREN Admin</title><link rel="stylesheet" href="/style.css"></head><body><main style="padding:30px 5%"><h1>LÉVAREN Admin</h1><p>Admin hesabıyla giriş yapıp bu sayfayı açın.</p><button class="btn" onclick="load()">Siparişleri yükle</button><div id="out"></div></main><script>async function load(){const r=await fetch("/api/admin/orders");const d=await r.json();if(!r.ok)return alert(d.error);document.querySelector("#out").innerHTML="<h2>Siparişler</h2>"+d.map(x=>`<div class="cartline"><span>${x.order_no}<br>${x.email}<br>${x.status}</span><b>${x.total} TL</b></div>`).join("")}</script></body></html>
