<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LÉVAREN Şifre Yenile</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:500px;margin:10vh auto;padding:30px"><h1>LÉVAREN</h1><h2>Yeni Şifre</h2><div class="form"><input id="p" type="password" placeholder="Yeni şifre"><button onclick="go()">Şifreyi Değiştir</button></div></main><script>async function go(){const t=new URLSearchParams(location.search).get("token");const r=await fetch("/api/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t,password:document.querySelector("#p").value})});const d=await r.json();alert(d.error||"Şifreniz değiştirildi.");if(r.ok)location.href="/";}</script></body></html>
